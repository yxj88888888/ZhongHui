<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee3d1">
  <title>中汇黄金 · 今日金价</title>
  <link rel="stylesheet" href="css/style.css?v=zhonghui-compact-header-20261007">
</head>
<body>
  <main class="gold-price-board" id="gold-price-board">
    <section class="board-shell" aria-labelledby="board-title">
      <header class="brand-mark">
        <div class="brand-logo" aria-label="中汇黄金">
          <img src="images/zhonghui-logo.jpg" alt="中汇黄金 Logo" width="1280" height="1280">
        </div>
        <div class="board-heading">
          <h1 id="board-title">今日金价</h1>
          <div class="title-rule" aria-hidden="true"></div>
        </div>
        <div class="qr-block">
          <a class="qr-code" href="images/zhonghui-wechat.png" target="_blank" rel="noopener" aria-label="查看中汇黄金微信二维码原图">
            <img src="images/zhonghui-wechat.png" alt="中汇黄金店铺微信二维码" width="806" height="922">
          </a>
          <span>扫码关注</span>
        </div>
      </header>

      <div class="board-rule" aria-hidden="true"></div>

      <div class="table-wrap">
        <table class="gold-price-table">
          <thead>
            <tr>
              <th scope="col">品类</th>
              <th scope="col">今日价格</th>
              <th scope="col">回收价格</th>
            </tr>
          </thead>
          <tbody>
            <tr data-price-id="jewelry_gold">
              <th scope="row">首饰金<small class="category-fee">工费另计</small></th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="non_member_bar">
              <th scope="row">非会员金条</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="member_bar">
              <th scope="row">会员金条</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="platinum">
              <th scope="row">铂金</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="silver">
              <th scope="row">白银</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer class="board-footer">
        <div class="board-notice">
          <p>注：此价格仅供参考，实际价格以门店成交价为准。</p>
          <small>贵金属投资不做非实物交易</small>
        </div>
        <p class="board-update">更新时间：<time id="updated-at">--</time></p>
        <p class="board-status" id="price-status" role="status" aria-live="polite"></p>
      </footer>
    </section>
  </main>
  <script src="js/app.js?v=zhonghui-ivory-20261007"></script>
</body>
</html>
