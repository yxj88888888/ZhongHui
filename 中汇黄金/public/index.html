<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cf9f79">
  <title>粤鑫金 · 贵金属价格</title>
  <link rel="stylesheet" href="css/style.css?v=fixed-price-board-20260923">
</head>
<body>
  <main class="gold-price-board" id="gold-price-board">
    <section class="board-shell" aria-labelledby="board-title">
      <header class="brand-mark">
        <div class="brand-logo">
          <img src="images/store/logo.jpg" alt="粤鑫金店铺 Logo">
        </div>
        <div class="brand-copy">
          <p class="brand-kicker">实时行情 · STORE BOARD</p>
          <h1 id="board-title">粤鑫金</h1>
          <p>贵金属价格牌</p>
        </div>
      </header>

      <div class="board-rule" aria-hidden="true"></div>

      <div class="board-intro">
        <div>
          <p class="board-eyebrow">TODAY'S PRECIOUS METALS</p>
          <h2>今日价格</h2>
        </div>
        <div class="board-status" id="price-status" role="status">正在读取价格…</div>
      </div>

      <div class="table-wrap">
        <table class="gold-price-table">
          <thead>
            <tr>
              <th scope="col">品类</th>
              <th scope="col">今日价格</th>
              <th scope="col">回收价格</th>
            </tr>
          </thead>
          <tbody>
            <tr data-price-id="jewelry_gold">
              <th scope="row">首饰金</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="non_member_bar">
              <th scope="row">非会员金条</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="member_bar">
              <th scope="row">会员金条</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="platinum">
              <th scope="row">铂金</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
            <tr data-price-id="silver">
              <th scope="row">白银</th>
              <td><span data-price-field="sell">--</span><small>元/克</small></td>
              <td><span data-price-field="recycle">--</span><small>元/克</small></td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer class="board-footer">
        <div class="qr-block">
          <img src="images/store-wechat-qr.jpg" alt="粤鑫金店铺微信二维码">
          <div>
            <strong>关注粤鑫金</strong>
            <span>了解实时行情</span>
          </div>
        </div>
        <div class="board-notice">
          <p>更新时间：<time id="updated-at">--</time></p>
          <p>贵金属投资不做非实物交易</p>
          <small>金价随市场波动，具体以门店成交价为准</small>
        </div>
      </footer>
    </section>
  </main>
  <script src="js/app.js?v=fixed-price-board-20260923"></script>
</body>
</html>
